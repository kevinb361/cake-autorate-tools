[project]
name = "cake-autorate-tools"
version = "0.1.0"
description = "Helpers and measurement tools around cake-autorate on a Linux CAKE shaper"
license = "GPL-2.0-only"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
